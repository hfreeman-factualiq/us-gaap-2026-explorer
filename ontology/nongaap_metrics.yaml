# Non-GAAP / management metrics bridged to US GAAP XBRL tags.
# Phase 1: ontology + formula logic only (not executed against EDGAR facts).
# Tags are local names as used in the US GAAP 2026 taxonomy (no us-gaap: prefix).

version: "2026-phase1"
publisher: "project"
notes: >
  These metrics are management concepts, not FASB Codification elements.
  Formulas use an AST: op is one of add|sub|mul|div|neg|abs|ref.
  ref nodes point at GAAP concept local names (or other nongaap:* ids).

metrics:
  - id: nongaap:FreeCashFlow
    label: Free Cash Flow (FCF)
    definition: >
      Cash generated by operations after capital expenditures. Common
      management liquidity measure; not a US GAAP line item.
    category: liquidity
    formula:
      op: sub
      args:
        - { op: ref, concept: NetCashProvidedByUsedInOperatingActivities }
        - { op: abs, args: [{ op: ref, concept: PaymentsToAcquirePropertyPlantAndEquipment }] }
    inputs:
      - NetCashProvidedByUsedInOperatingActivities
      - PaymentsToAcquirePropertyPlantAndEquipment
    expression: "OperatingCashFlow - CapEx"
    reconciliationHint: Start from GAAP operating cash flow; subtract cash CapEx.
    secCaveats: [cdi:102.05, cdi:102.07, cdi:102.10]
    fiboAligns: [fibo:FreeCashFlow]

  - id: nongaap:FreeCashFlowAltInvesting
    label: Free Cash Flow (OCF + Investing)
    definition: >
      Alternate FCF proxy using net investing cash flow instead of CapEx alone.
    category: liquidity
    formula:
      op: add
      args:
        - { op: ref, concept: NetCashProvidedByUsedInOperatingActivities }
        - { op: ref, concept: NetCashProvidedByUsedInInvestingActivities }
    inputs:
      - NetCashProvidedByUsedInOperatingActivities
      - NetCashProvidedByUsedInInvestingActivities
    expression: "OperatingCashFlow + InvestingCashFlow"
    alternativeOf: nongaap:FreeCashFlow
    reconciliationHint: Broader than CapEx-only FCF; includes all investing outflows/inflows.
    secCaveats: [cdi:102.05, cdi:102.07]

  - id: nongaap:CashBurn
    label: Cash Burn
    definition: >
      Rate at which a company uses cash reserves. Often modeled as operating
      plus investing cash flows (negative = burn).
    category: liquidity
    formula:
      op: add
      args:
        - { op: ref, concept: NetCashProvidedByUsedInOperatingActivities }
        - { op: ref, concept: NetCashProvidedByUsedInInvestingActivities }
    inputs:
      - NetCashProvidedByUsedInOperatingActivities
      - NetCashProvidedByUsedInInvestingActivities
    expression: "OperatingCashFlow + InvestingCashFlow"
    reconciliationHint: Negative combined OCF+Investing indicates cash burn.
    secCaveats: [cdi:102.05, cdi:102.07]
    fiboAligns: []

  - id: nongaap:CashBurnCapEx
    label: Cash Burn (OCF − CapEx)
    definition: CapEx-focused cash burn / FCF mirror (negative FCF).
    category: liquidity
    formula:
      op: sub
      args:
        - { op: ref, concept: NetCashProvidedByUsedInOperatingActivities }
        - { op: abs, args: [{ op: ref, concept: PaymentsToAcquirePropertyPlantAndEquipment }] }
    inputs:
      - NetCashProvidedByUsedInOperatingActivities
      - PaymentsToAcquirePropertyPlantAndEquipment
    expression: "OperatingCashFlow - CapEx"
    alternativeOf: nongaap:CashBurn
    secCaveats: [cdi:102.05]

  - id: nongaap:EBITDA
    label: EBITDA
    definition: >
      Operating performance indicator approximating earnings before interest,
      taxes, depreciation, and amortization. Common proxy uses operating income
      plus D&A when interest/tax line items are not mixed into operating income.
    category: profitability
    formula:
      op: add
      args:
        - { op: ref, concept: OperatingIncomeLoss }
        - { op: ref, concept: DepreciationDepletionAndAmortization }
    inputs:
      - OperatingIncomeLoss
      - DepreciationDepletionAndAmortization
    expression: "OperatingIncome + DepreciationAndAmortization"
    reconciliationHint: >
      Prefer reconciling from Net Income: + Interest + Taxes + D&A ± adjustments
      when building Adjusted EBITDA disclosures.
    secCaveats: [cdi:102.09, cdi:102.10]
    fiboAligns: [fibo:EBITDA]

  - id: nongaap:AdjustedEBITDA
    label: Adjusted EBITDA
    definition: >
      EBITDA plus/minus non-recurring or non-cash items as defined by management.
      One-time items are placeholders — company-specific; not a single GAAP tag.
    category: profitability
    formula:
      op: add
      args:
        - { op: ref, concept: "nongaap:EBITDA" }
        - { op: ref, concept: "nongaap:NonRecurringAdjustmentsPlaceholder" }
    inputs:
      - OperatingIncomeLoss
      - DepreciationDepletionAndAmortization
    expression: "EBITDA ± OneTimeItems"
    reconciliationHint: >
      Must reconcile to the most directly comparable GAAP measure (typically
      Net Income or Operating Income) per SEC Non-GAAP C&DIs.
    secCaveats: [cdi:100.01, cdi:102.03, cdi:102.09, cdi:102.10]
    fiboAligns: []

  - id: nongaap:NonRecurringAdjustmentsPlaceholder
    label: Non-Recurring Adjustments (Placeholder)
    definition: >
      Placeholder for company-defined add-backs/deductions (restructuring,
      stock-based compensation, impairments, etc.). Not a GAAP concept.
    category: adjustment
    formula: { op: ref, concept: ProfitLoss }
    inputs: [ProfitLoss]
    expression: "company-defined"
    isPlaceholder: true
    secCaveats: [cdi:100.01, cdi:102.03]

  - id: nongaap:WorkingCapital
    label: Working Capital
    definition: Short-term liquidity — current assets minus current liabilities.
    category: liquidity
    formula:
      op: sub
      args:
        - { op: ref, concept: AssetsCurrent }
        - { op: ref, concept: LiabilitiesCurrent }
    inputs:
      - AssetsCurrent
      - LiabilitiesCurrent
    expression: "CurrentAssets - CurrentLiabilities"
    secCaveats: [cdi:102.05]
    fiboAligns: [fibo:WorkingCapital]

  - id: nongaap:NetDebt
    label: Net Debt
    definition: >
      Interest-bearing debt net of cash. Uses combined debt concepts when available;
      cash uses carrying-value cash and cash equivalents.
    category: leverage
    formula:
      op: sub
      args:
        - { op: ref, concept: LongTermDebtAndCapitalLeaseObligations }
        - { op: ref, concept: CashAndCashEquivalentsAtCarryingValue }
    inputs:
      - LongTermDebtAndCapitalLeaseObligations
      - CashAndCashEquivalentsAtCarryingValue
    expression: "Debt - CashAndCashEquivalents"
    reconciliationHint: >
      Prefer DebtCurrent + LongTermDebt when classified; exclude operating lease
      liabilities if management defines net debt that way.
    secCaveats: [cdi:102.05, cdi:102.07]
    fiboAligns: [fibo:NetDebt]

  - id: nongaap:GrossMargin
    label: Gross Margin
    definition: Gross profit as a percentage of revenue (net sales).
    category: profitability
    formula:
      op: div
      args:
        - { op: ref, concept: GrossProfit }
        - { op: ref, concept: RevenueFromContractWithCustomerExcludingAssessedTax }
    inputs:
      - GrossProfit
      - RevenueFromContractWithCustomerExcludingAssessedTax
    expression: "GrossProfit / Revenue"
    alternateInputs:
      revenue:
        - Revenues
        - SalesRevenueNet
    secCaveats: []
    fiboAligns: [fibo:GrossMargin]

  - id: nongaap:OperatingMargin
    label: Operating Margin
    definition: Operating income as a percentage of revenue.
    category: profitability
    formula:
      op: div
      args:
        - { op: ref, concept: OperatingIncomeLoss }
        - { op: ref, concept: RevenueFromContractWithCustomerExcludingAssessedTax }
    inputs:
      - OperatingIncomeLoss
      - RevenueFromContractWithCustomerExcludingAssessedTax
    expression: "OperatingIncome / Revenue"
    secCaveats: []

  - id: nongaap:ARR
    label: Annual Recurring Revenue (ARR)
    definition: >
      SaaS KPI — annualized value of recurring subscription revenue. Not a US GAAP
      concept; approximated from contract/subscription revenue tags when disclosed.
    category: saas
    formula:
      op: ref
      concept: RevenueFromContractWithCustomerExcludingAssessedTax
    inputs:
      - RevenueFromContractWithCustomerExcludingAssessedTax
    expression: "annualized recurring revenue (management)"
    isApproximation: true
    reconciliationHint: >
      ARR is typically derived from subscription bookings/MRR × 12, not a single
      GAAP tag. Map to contract revenue only as a coarse proxy.
    secCaveats: [cdi:100.01, cdi:102.10]
    fiboAligns: []

  - id: nongaap:NetRevenueRetention
    label: Net Revenue Retention
    definition: >
      SaaS KPI — retained and expanded recurring revenue from existing customers
      over a period, divided by starting recurring revenue. Not a GAAP concept.
    category: saas
    formula:
      op: div
      args:
        - { op: ref, concept: "nongaap:EndingRecurringRevenuePlaceholder" }
        - { op: ref, concept: "nongaap:BeginningRecurringRevenuePlaceholder" }
    inputs: []
    expression: "EndingARR_from_cohort / BeginningARR_from_cohort"
    isApproximation: true
    isPlaceholder: true
    reconciliationHint: Requires cohort/subscription subledger data beyond GAAP tags.
    secCaveats: [cdi:100.01, cdi:102.10]

  - id: nongaap:BeginningRecurringRevenuePlaceholder
    label: Beginning Recurring Revenue (Placeholder)
    definition: Placeholder for starting-period ARR/MRR cohort base.
    category: saas
    formula: { op: ref, concept: RevenueFromContractWithCustomerExcludingAssessedTax }
    inputs: [RevenueFromContractWithCustomerExcludingAssessedTax]
    isPlaceholder: true
    secCaveats: []

  - id: nongaap:EndingRecurringRevenuePlaceholder
    label: Ending Recurring Revenue (Placeholder)
    definition: Placeholder for ending-period ARR/MRR including expansion, net of churn.
    category: saas
    formula: { op: ref, concept: RevenueFromContractWithCustomerExcludingAssessedTax }
    inputs: [RevenueFromContractWithCustomerExcludingAssessedTax]
    isPlaceholder: true
    secCaveats: []

  - id: nongaap:NetIncomeToEBITDABridge
    label: Net Income to EBITDA Bridge
    definition: >
      Canonical reconciliation skeleton from GAAP net income toward EBITDA
      (Interest + Tax + D&A). Used as agent guidance for Non-GAAP tables.
    category: reconciliation
    formula:
      op: add
      args:
        - { op: ref, concept: ProfitLoss }
        - { op: ref, concept: InterestExpense }
        - { op: ref, concept: IncomeTaxExpenseBenefit }
        - { op: ref, concept: DepreciationDepletionAndAmortization }
    inputs:
      - ProfitLoss
      - InterestExpense
      - IncomeTaxExpenseBenefit
      - DepreciationDepletionAndAmortization
    expression: "NetIncome + Interest + Taxes + D&A"
    reconciliationHint: Matches common SEC Non-GAAP reconciliation presentation.
    secCaveats: [cdi:102.09, cdi:102.10]
