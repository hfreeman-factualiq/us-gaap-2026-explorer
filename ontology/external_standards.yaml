      - id: cobit:BAI
        label: Build, Acquire and Implement
      - id: cobit:DSS
        label: Deliver, Service and Support
      - id: cobit:MEA
        label: Monitor, Evaluate and Assess
      - id: cobit:GovernanceObjective
        label: Governance Objective
      - id: cobit:ManagementObjective
        label: Management Objective
      - id: cobit:DesignFactor
        label: Design Factor

