      - kind: http-html
        url: https://dora.dev/research/
        note: Research / State of DevOps reports (metric catalogs)
      - kind: http-json
        url: https://raw.githubusercontent.com/GoogleCloudPlatform/fourkeys/main/README.md
        note: Four Keys project — open implementation of DORA metrics pipeline
    keyClasses:
      - id: dora:DeploymentFrequency
        label: Deployment Frequency
      - id: dora:LeadTimeForChanges
        label: Lead Time for Changes
      - id: dora:ChangeFailureRate
        label: Change Failure Rate
      - id: dora:TimeToRestoreService
        label: Time to Restore Service (MTTR)
      - id: dora:Reliability
        label: Reliability (fifth key / ops)
      - id: dora:Throughput
        label: Throughput (composite)
      - id: dora:Stability
        label: Stability (composite)

  - id: open-fair
    label: Open FAIR Ontology (Factor Analysis of Information Risk)
    steward: The Open Group
    formats: [XML, OWL, PDF Taxonomy]
    integration: registered
    domains: [risk_exposure]
    coverage: >
      Formal taxonomy for quantitative risk. Breaks risk into Loss Event
      Frequency (Threat Event Frequency × Vulnerability) and Loss Magnitude
      (Primary vs Secondary Losses). Machine-readable OWL is community-curated;
      normative O-RT / O-RA are PDF standards.
    scrape:
      - kind: http-html
        url: https://www.opengroup.org/open-fair
        note: Open FAIR Body of Knowledge overview
      - kind: http-html
        url: https://publications.opengroup.org/standards/open-fair-standards
        note: O-RT (Risk Taxonomy) and O-RA (Risk Analysis) standard downloads
      - kind: manual
        url: https://publications.opengroup.org/c20a
        note: Risk Taxonomy (O-RT) PDF — curate key classes from taxonomy tables
    keyClasses:
      - id: fair:Risk
        label: Risk
      - id: fair:LossEventFrequency
        label: Loss Event Frequency (LEF)
      - id: fair:ThreatEventFrequency
        label: Threat Event Frequency (TEF)
      - id: fair:Vulnerability
        label: Vulnerability
      - id: fair:LossMagnitude
        label: Loss Magnitude (LM)
      - id: fair:PrimaryLoss
        label: Primary Loss
      - id: fair:SecondaryLoss
        label: Secondary Loss
      - id: fair:ThreatActor
        label: Threat Actor
      - id: fair:Asset
        label: Asset (at risk)

  - id: cobit
