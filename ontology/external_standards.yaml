# Registry of formalized ontologies / taxonomies / schemas to scrape for concepts,
# organized by signal domain. Source of truth for the v1.3 base template tree.
#
# `integration` values:
#   full       - already parsed into the ontology (concepts exist as nodes)
#   partial    - a curated subset exists; more concepts remain to be scraped
#   registered - declared here as a scrape target; concepts are curated stubs only
#
# Scrape kinds: local | http-json | http-jsonld | http-rdf | http-zip | http-html | manual
# `verified: false` marks a target whose exact artifact URL still needs confirmation;
# scripts/harvest_external_standards.py probes every target and records reachability.

version: "2026-v1.31"
publisher: "project"
notes: >
  Signal domains are the underwriting/monitoring surfaces we want machine-readable
  concepts for. Each signal names the formalized standard(s) that already codify it
  so concept scraping has an explicit target instead of ad-hoc label matching.
  v1.31 adds strategy, decision, value-stream, supply-chain, capability, eng-health,
  risk, governance, service-delivery, and ESG-materiality domains.

standards:
  - id: us-gaap-xbrl
    label: FASB US GAAP XBRL Taxonomy
    steward: FASB
    formats: [XBRL, XML Schema]
    integration: full
    domains: [income_statement, cash_flow, balance_sheet, plan_forecast, reporting_narrative]
    coverage: >
      Direct coverage of all statutory line items, plus calculation linkbases used as
      explicit DAGs for deriving non-GAAP metrics from GAAP tags.
    scrape:
      - kind: local
        url: us-gaap-2026/
        note: Local FASB taxonomy package parsed by build_viewer_data.py
      - kind: http-html
        url: https://xbrl.fasb.org/us-gaap/2026/
        note: Published taxonomy package index (entry points, linkbases)
    keyClasses:
      - id: us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
        label: Revenue from Contract with Customer
        mapsTo: [RevenueFromContractWithCustomerExcludingAssessedTax]
      - id: us-gaap:CostOfGoodsAndServicesSold
        label: Cost of Goods and Services Sold
        mapsTo: [CostOfGoodsAndServicesSold]
      - id: us-gaap:SellingAndMarketingExpense
        label: Selling and Marketing Expense
        mapsTo: [SellingAndMarketingExpense]
      - id: us-gaap:ResearchAndDevelopmentExpense
        label: Research and Development Expense
        mapsTo: [ResearchAndDevelopmentExpense]
      - id: us-gaap:GeneralAndAdministrativeExpense
        label: General and Administrative Expense
        mapsTo: [GeneralAndAdministrativeExpense]
      - id: us-gaap:AllocatedShareBasedCompensationExpense
        label: Allocated Share-Based Compensation Expense
        mapsTo: [AllocatedShareBasedCompensationExpense, ShareBasedCompensation]
      - id: us-gaap:NetCashProvidedByUsedInOperatingActivities
        label: Net Cash from Operating Activities
        mapsTo: [NetCashProvidedByUsedInOperatingActivities]
      - id: us-gaap:PaymentsToAcquirePropertyPlantAndEquipment
        label: Capital Expenditures
        mapsTo: [PaymentsToAcquirePropertyPlantAndEquipment]
      - id: us-gaap:DeferredRevenue
        label: Deferred Revenue / Contract Liability
        mapsTo: [ContractWithCustomerLiability, DeferredRevenue]
      - id: us-gaap:AccountsReceivableNetCurrent
        label: Accounts Receivable, Net, Current
        mapsTo: [AccountsReceivableNetCurrent]
      - id: xbrl:CalculationLinkbase
        label: Calculation Linkbase (non-GAAP derivation DAG)
        note: >
          Calculation linkbases let non-GAAP metrics be written as explicit DAGs over
          GAAP tags (e.g. Magic Number from ARR deltas and us-gaap:SellingAndMarketingExpense).

  - id: xbrl-gl
    label: XBRL Global Ledger Framework (XBRL GL)
    steward: XBRL International
    formats: [XML, XBRL]
    integration: registered
    domains: [income_statement, plan_forecast, reporting_narrative]
    coverage: >
      Represents internal accounting databases rather than final statements. Natively
      supports plan-vs-actual modelling by tagging any GL row with entryType
      (Actual | Budget | Forecast | Re-forecast), budget version, scenario and period.
    scrape:
      - kind: http-html
        url: https://www.xbrl.org/the-standard/what/global-ledger/
        note: Framework overview and module descriptions (gl-cor, gl-bus, gl-muc, gl-taf)
      - kind: http-html
        url: https://www.xbrl.org/guidance/xbrl-gl/
        note: Implementation guidance for GL entry/scenario tagging
      - kind: http-html
        url: https://specifications.xbrl.org/
        note: Specification index — locate the current Global Ledger work product
    keyClasses:
      - id: gl-cor:accountingEntries
        label: Accounting Entries (GL document root)
      - id: gl-cor:entryHeader
        label: Entry Header (scenario / posting metadata)
      - id: gl-cor:entryDetail
        label: Entry Detail (GL row)
      - id: gl-cor:entryType
        label: Entry Type (Actual | Budget | Forecast | Re-forecast)
      - id: gl-bus:budgetVersion
        label: Budget Version
      - id: gl-cor:accountMainID
        label: Chart of Accounts Identifier
      - id: gl-cor:postingDate
        label: Posting Date (report lag / period flags)

  - id: open-saas
    label: Open-SaaS Metrics Schema
    steward: Open-source community (GitHub)
    formats: [JSON Schema]
    integration: registered
    verified: false
    domains: [unit_economics, commercial_pipeline]
    coverage: >
      Community JSON Schemas that codify non-GAAP SaaS metrics (CAC, LTV/CAC, magic
      number, burn multiple, NRR) which GAAP deliberately does not define. Paired with
      XBRL calculation linkbases so each ratio resolves to GAAP inputs.
    scrape:
      - kind: http-json
        url: https://api.github.com/search/repositories?q=saas+metrics+json-schema&sort=stars
        note: Repository discovery — exact canonical repo still to be pinned
      - kind: http-json
        url: https://api.github.com/search/code?q=magic+number+arr+filename:schema.json
        note: Schema-file discovery across community repos (needs GitHub token)
    keyClasses:
      - id: opensaas:AnnualRecurringRevenue
        label: Annual Recurring Revenue (ARR)
        mapsTo: [nongaap:ARR]
      - id: opensaas:MonthlyRecurringRevenue
        label: Monthly Recurring Revenue (MRR)
      - id: opensaas:CustomerAcquisitionCost
        label: Customer Acquisition Cost (CAC)
      - id: opensaas:CACPayback
        label: CAC Payback Period
      - id: opensaas:LTV_CAC_Ratio
        label: LTV / CAC Ratio
      - id: opensaas:MagicNumber
        label: Magic Number
        expression: "((ARR_t - ARR_t-1) * 4) / S&M_Spend_t-1"
      - id: opensaas:BurnMultiple
        label: Burn Multiple
        expression: "NetBurn / NetNewARR"
      - id: opensaas:NetRevenueRetention
        label: Net Revenue Retention (NRR)
        mapsTo: [nongaap:NetRevenueRetention]
      - id: opensaas:RevenueMix
        label: Revenue Mix (recurring vs non-recurring)

  - id: actus
    label: ACTUS (Algorithmic Contract Types Unified Standards)
    steward: ACTUS Financial Research Foundation
    formats: [JSON, OWL, Algorithmic]
    integration: registered
    domains: [cash_flow, balance_sheet]
    coverage: >
      Simulates contract-level cash flows (principal, interest, drawdowns, prepayment)
      from a standardized term dictionary — the missing layer under runway and debt
      service modelling.
    scrape:
      - kind: http-json
        url: https://raw.githubusercontent.com/actusfrf/actus-dictionary/master/actus-dictionary.json
        note: Canonical machine-readable dictionary of contract types, terms and events
      - kind: http-html
        url: https://www.actusfrf.org/dictionary
        note: Human-readable dictionary browser
    keyClasses:
      - id: actus:PAM
        label: Principal At Maturity (PAM)
      - id: actus:LAM
        label: Linear Amortizer (LAM)
      - id: actus:ANN
        label: Annuity (ANN)
      - id: actus:NAM
        label: Negative Amortizer (NAM)
      - id: actus:CLM
        label: Call Money (CLM)
      - id: actus:UMP
        label: Undefined Maturity Profile (UMP)
      - id: actus:NotionalPrincipal
        label: Notional Principal (term)
      - id: actus:NominalInterestRate
        label: Nominal Interest Rate (term)
      - id: actus:CycleOfPrincipalRedemption
        label: Cycle of Principal Redemption (term)
      - id: actus:IED
        label: Initial Exchange Date (event)
      - id: actus:PR
        label: Principal Redemption (event)
      - id: actus:IP
        label: Interest Payment (event)

  - id: ocf
    label: Open Cap Format (OCF)
    steward: Open Cap Table Coalition
    formats: [JSON Schema]
    integration: registered
    domains: [balance_sheet]
    coverage: >
      Vendor-neutral open schema for equity and cap tables. Represents every stock
      class, convertible note, SAFE, option pool and dilution event as machine-readable
      JSON — the standard for equity_events.
    scrape:
      - kind: http-json
        url: https://api.github.com/repos/Open-Cap-Table-Coalition/Open-Cap-Format-OCF/git/trees/main?recursive=1
        note: Enumerate every schema/*.json object and enum in the OCF repo
      - kind: http-html
        url: https://open-cap-table-coalition.github.io/Open-Cap-Format-OCF/
        note: Published schema documentation
    keyClasses:
      - id: ocf:StockClass
        label: Stock Class
      - id: ocf:StockIssuance
        label: Stock Issuance
      - id: ocf:ConvertibleIssuance
        label: Convertible Issuance (SAFE / note)
      - id: ocf:WarrantIssuance
        label: Warrant Issuance
      - id: ocf:EquityCompensationIssuance
        label: Equity Compensation Issuance (option grant)
      - id: ocf:StockPlan
        label: Stock Plan (option pool)
      - id: ocf:VestingTerms
        label: Vesting Terms
      - id: ocf:Valuation
        label: Valuation (409A / round price)
      - id: ocf:StockClassConversionRight
        label: Conversion Right (dilution mechanics)

  - id: apqc-pcf
    label: APQC Process Classification Framework (PCF)
    steward: APQC
    formats: [XML, XLSX]
    integration: registered
    domains: [commercial_pipeline, team_headcount]
    coverage: >
      Codifies cross-industry business processes and their operational KPIs.
      Category 3.0 (Market and Sell Products and Services) covers pipeline, bookings,
      win rate and retention process definitions.
    scrape:
      - kind: http-html
        url: https://www.apqc.org/process-performance-management/process-frameworks
        note: Cross-industry PCF downloads (XLSX/PDF per version)
      - kind: manual
        url: https://www.apqc.org/resource-library/resource-listing/apqc-process-classification-framework-pcf-cross-industry-excel-8
        note: Registration-gated download; parse the XLSX offline into process/KPI nodes
    keyClasses:
      - id: apqc:Category_3_0
        label: 3.0 Market and Sell Products and Services
      - id: apqc:Process_3_2_2
        label: 3.2.2 Manage Sales Pipeline
      - id: apqc:Process_3_5_0
        label: 3.5 Manage Sales Orders / Bookings
      - id: apqc:KPI_WinRate
        label: KPI — Win Rate
      - id: apqc:KPI_CustomerRetentionRate
        label: KPI — Customer Retention Rate
      - id: apqc:KPI_SalesCycleTime
        label: KPI — Sales Cycle Time

  - id: schema-org
    label: Schema.org (Action / Offer vocabulary)
    steward: W3C Schema.org Community Group
    formats: [JSON-LD, RDF]
    integration: registered
    domains: [commercial_pipeline, external_events]
    coverage: >
      Publicly crawlable vocabulary for commercial offers, orders, pricing and actions
      — useful for typing external pricing/partner claims and pipeline artifacts.
    scrape:
      - kind: http-jsonld
        url: https://schema.org/version/latest/schemaorg-current-https.jsonld
        note: Full vocabulary in JSON-LD (classes, properties, enumerations)
    keyClasses:
      - id: schema:Offer
        label: Offer
      - id: schema:Demand
        label: Demand
      - id: schema:Order
        label: Order
      - id: schema:PriceSpecification
        label: Price Specification
      - id: schema:SellAction
        label: Sell Action
      - id: schema:Organization
        label: Organization
      - id: schema:MonetaryAmount
        label: Monetary Amount

  - id: w3c-org
    label: W3C Organization Ontology (ORG)
    steward: W3C
    formats: [OWL, RDF, Turtle]
    integration: registered
    domains: [team_headcount]
    coverage: >
      Structures org charts, posts and reporting lines as semantic triples
      (Person -> holds -> Post -> in -> OrganizationalUnit) with temporal tracking of
      role changes, so reorgs and leadership events are first-class facts.
    scrape:
      - kind: http-rdf
        url: https://www.w3.org/ns/org.ttl
        note: Canonical Turtle serialization of the ORG vocabulary
      - kind: http-html
        url: https://www.w3.org/TR/vocab-org/
        note: Specification text for class/property definitions
    keyClasses:
      - id: org:Organization
        label: Organization
      - id: org:OrganizationalUnit
        label: Organizational Unit
      - id: org:Post
        label: Post (role / seat)
      - id: org:Membership
        label: Membership (person-in-post, time bounded)
      - id: org:reportsTo
        label: reportsTo
      - id: org:headOf
        label: headOf
      - id: org:hasSubOrganization
        label: hasSubOrganization
      - id: org:ChangeEvent
        label: Change Event (merger / split / reorg)

  - id: iso-30414
    label: ISO 30414 Human Capital Reporting
    steward: ISO
    formats: [Metric Specification]
    integration: registered
    domains: [team_headcount]
    coverage: >
      Standardizes workforce metric definitions (turnover, FTE, vacancy, cost) so
      headcount signals are comparable across companies and periods.
    scrape:
      - kind: manual
        url: https://www.iso.org/standard/69338.html
        note: Standard text is paywalled — curate metric definitions manually
      - kind: http-html
        url: https://www.iso.org/obp/ui/#iso:std:iso:30414:ed-1:v1:en
        note: >
          Online Browsing Platform preview of the terms and definitions section.
          Returns 403 to scripted clients — read it in a browser and curate by hand.
    keyClasses:
      - id: iso30414:TurnoverRate
        label: Turnover Rate
      - id: iso30414:FullTimeEquivalent_FTE
        label: Full-Time Equivalent (FTE)
      - id: iso30414:VacancyRate
        label: Vacancy Rate
      - id: iso30414:TimeToFillVacantPositions
        label: Time to Fill Vacant Positions
      - id: iso30414:WorkforceCosts
        label: Total Workforce Costs
      - id: iso30414:CriticalPositionTurnover
        label: Critical Position Turnover
      - id: iso30414:LeadershipDepth
        label: Leadership Depth / Succession Readiness

  - id: fibo
    label: FIBO (Financial Industry Business Ontology)
    steward: EDM Council
    formats: [OWL, RDF]
    integration: partial
    domains:
      [unit_economics, balance_sheet, external_events, reporting_narrative, cash_flow]
    coverage: >
      Models contracts, corporate equity and debt, business entities, regulators and
      financial reporting provenance. Eight curated concepts are already aligned to
      GAAP/non-GAAP nodes; the modules below are the remaining scrape surface.
    scrape:
      - kind: http-zip
        url: https://github.com/edmcouncil/fibo/archive/refs/tags/master_2026Q1.zip
        note: Sparse extract already wired in scripts/fetch_external_resources.py
      - kind: http-rdf
        url: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/
        note: Contracts module — recurring payment / contractual term classes
      - kind: http-rdf
        url: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/
        note: Corporate debt module
      - kind: http-rdf
        url: https://spec.edmcouncil.org/fibo/ontology/SEC/Equities/EquityInstruments/
        note: Corporate equity module
      - kind: http-rdf
        url: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/
        note: Business entities module
      - kind: http-rdf
        url: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/AccountingEquity/
        note: Financial reporting / accounting equity module (report provenance)
      - kind: http-rdf
        url: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/
        note: Monetary amount module (already curated into the fibo layer)
    keyClasses:
      - id: fibo-fnd-agr-ctr:RecurringPayment
        label: Recurring Payment (ARR / MRR basis)
        mapsTo: [nongaap:ARR]
      - id: fibo-fbc-dae-dbt:DebtInstrument
        label: Debt Instrument
        mapsTo: [nongaap:NetDebt]
      - id: fibo-fbc-dae-eq:EquityInstrument
        label: Equity Instrument
      - id: fibo-be-le-lp:LegalEntity
        label: Legal Entity
      - id: fibo-fbc-fbc:RegulatoryAgency
        label: Regulatory Agency
      - id: fibo-fnd-acc-cur:MonetaryAmount
        label: Monetary Amount
      - id: fibo-fnd-acc-aeq:FinancialReport
        label: Financial Report (statement provenance)

  - id: fro
    label: Financial Regulation Ontology (FRO)
    steward: Jayzed Data Models
    formats: [OWL, RDF]
    integration: registered
    verified: false
    domains: [external_events, reporting_narrative]
    coverage: >
      Bridges legal/regulatory text to FIBO business entities, giving regulatory events
      and compliance obligations a formal home alongside financial concepts.
    scrape:
      - kind: http-html
        url: https://finregont.com/
        note: Ontology downloads (Turtle/OWL) and module documentation
      - kind: http-rdf
        url: https://finregont.com/fro/
        note: Module namespace root — confirm exact artifact filenames before parsing
    keyClasses:
      - id: fro:Regulation
        label: Regulation
      - id: fro:LegalRule
        label: Legal Rule
      - id: fro:RegulatoryFiling
        label: Regulatory Filing
      - id: fro:ComplianceObligation
        label: Compliance Obligation

  - id: archimate
    label: ArchiMate Business Metamodel
    steward: The Open Group
    formats: [XML, XSD]
    integration: registered
    domains: [external_events]
    coverage: >
      Captures the external environment — events, drivers, constraints, contracts and
      products — so competitive, pricing and partnership signals are typed rather than
      free text.
    scrape:
      - kind: http-html
        url: https://www.opengroup.org/xsd/archimate/
        note: Open Exchange File Format XSDs (element and relationship types)
      - kind: http-html
        url: https://www.opengroup.org/archimate-forum/archimate-overview
        note: >
          Business-layer element definitions. The pubs.opengroup.org specification text
          requires an account, so parse element/relationship types from the XSDs above.
    keyClasses:
      - id: archimate:BusinessEvent
        label: Business Event
      - id: archimate:BusinessActor
        label: Business Actor (competitor / partner)
      - id: archimate:Constraint
        label: Constraint (regulatory / contractual)
      - id: archimate:Driver
        label: Driver
      - id: archimate:Assessment
        label: Assessment (market claim)
      - id: archimate:Contract
        label: Contract
      - id: archimate:Product
        label: Product (pricing event subject)

  - id: sec-ixbrl
    label: SEC EDGAR Inline XBRL (iXBRL) & Staff Guidance
    steward: U.S. Securities and Exchange Commission
    formats: [iXBRL, JSON, CSV]
    integration: partial
    domains: [reporting_narrative, income_statement, plan_forecast]
    coverage: >
      Ties footnotes, accounting changes and MD&A management claims back to tagged
      source paragraphs. Non-GAAP C&DIs are already merged as rule nodes; the datasets
      below extend coverage to filing-level facts and report lag.
    scrape:
      - kind: http-html
        url: https://www.sec.gov/dera/data/financial-statement-data-sets
        note: Quarterly statement + footnote datasets (num/pre/sub/tag)
      - kind: http-json
        url: https://data.sec.gov/api/xbrl/frames/us-gaap/Revenues/USD/CY2025Q4I.json
        note: Frames API sample — concept usage across filers
      - kind: http-html
        url: https://www.sec.gov/rules-regulations/staff-guidance/corporation-finance-interpretations/non-gaap-financial-measures
        note: Non-GAAP C&DIs (already integrated as rule nodes)
    keyClasses:
      - id: ixbrl:FootnoteTuple
        label: iXBRL Footnote / Tuple Structure
      - id: dei:DocumentPeriodEndDate
        label: Document Period End Date (report lag)
      - id: sec:AccountingChangeDisclosure
        label: Accounting Change Disclosure
      - id: sec:MDandASection
        label: MD&A Section (management claims)

  - id: iris-plus
    label: IRIS+ Taxonomy
    steward: Global Impact Investing Network (GIIN)
    formats: [JSON, XML, RDF]
    integration: registered
    domains: [impact_outcomes]
    coverage: >
      The global metric catalog for impact underwriting — standardized outcome and
      stakeholder indicators with codes that survive across portfolios.
    scrape:
      - kind: http-html
        url: https://iris.thegiin.org/metrics/
        note: Metric catalog browser (IRIS metric codes, definitions, usage guidance)
      - kind: manual
        url: https://iris.thegiin.org/document/iris-catalog-of-metrics/
        note: Bulk catalog download — parse into metric nodes with PI/OI/OD codes
    keyClasses:
      - id: iris:PI4060
        label: PI4060 — Target Stakeholders
      - id: iris:OI1234
        label: OI1234 — Outcome Metric
      - id: iris:PD_ProductDescription
        label: PD — Product / Service Description
      - id: iris:OD_OrganizationDescription
        label: OD — Organization Description
      - id: iris:CostPerOutcome
        label: Cost per Outcome (efficiency indicator)

  - id: imp
    label: Impact Management Project — Five Dimensions of Impact
    steward: Impact Frontiers (formerly IMP)
    formats: [RDF, JSON]
    integration: registered
    domains: [impact_outcomes]
    coverage: >
      The five-dimension frame (What, Who, How Much, Contribution, Risk) that organizes
      impact evidence into an auditable path from activity to outcome.
    scrape:
      - kind: http-html
        url: https://impactfrontiers.org/norms/five-dimensions-of-impact/
        note: Dimension and sub-dimension definitions
      - kind: http-html
        url: https://impactfrontiers.org/norms/impact-management-norms/
        note: Norms text for contribution and risk taxonomies
    keyClasses:
      - id: imp:What
        label: What (outcome and its importance)
      - id: imp:Who
        label: Who (stakeholders and baseline)
      - id: imp:HowMuch
        label: How Much (scale, depth, duration)
      - id: imp:Contribution
        label: Contribution (counterfactual)
      - id: imp:Risk
        label: Impact Risk

  # ---- v1.31: Strategy, Ops, Governance frameworks --------------------------------

  - id: bmm
    label: Business Motivation Model (BMM)
    steward: Object Management Group (OMG)
    formats: [XMI, XML, OWL]
    integration: registered
    domains: [strategy_motivation]
    coverage: >
      Models the why of a business: Vision, Mission, Strategy, Tactics, Goals,
      Objectives and Business Policies. Lets a bot check whether operational
      actions align with strategic ends.
    scrape:
      - kind: http-html
        url: https://www.omg.org/spec/BMM/1.3/
        note: Specification index (PDF + machine-readable XMI)
      - kind: http-rdf
        url: https://www.omg.org/spec/BMM/20141108/BMM.xmi
        note: Normative BMM 1.3 XMI metamodel — scrape packagedElement / class names
    keyClasses:
      - id: bmm:Vision
        label: Vision
      - id: bmm:Mission
        label: Mission
      - id: bmm:Strategy
        label: Strategy
      - id: bmm:Tactic
        label: Tactic
      - id: bmm:Goal
        label: Goal
      - id: bmm:Objective
        label: Objective
      - id: bmm:BusinessPolicy
        label: Business Policy
      - id: bmm:BusinessRule
        label: Business Rule
      - id: bmm:Influencer
        label: Influencer
      - id: bmm:Assessment
        label: Assessment

  - id: dmn
    label: Decision Model and Notation (DMN)
    steward: Object Management Group (OMG)
    formats: [XML Schema, FEEL, XMI]
    integration: registered
    domains: [decision_logic]
    coverage: >
      Formal standard for operational decision-making. Captures input data,
      decision requirements diagrams (DRDs) and decision tables so complex
      business choices can be automated or audited.
    scrape:
      - kind: http-html
        url: https://www.omg.org/spec/DMN/1.5
        note: DMN 1.5 specification index
      - kind: http-json
        url: https://www.omg.org/spec/DMN/20230324/DMN15.xsd
        note: Normative DMN 1.5 XSD — scrape element / complexType names
      - kind: http-json
        url: https://raw.githubusercontent.com/omg-dmn-taskforce/omg-dmn-spec/v1.5/xsd/DMN15.xsd
        note: GitHub mirror of DMN 1.5 XSD (stable raw URL)
    keyClasses:
      - id: dmn:Definitions
        label: Definitions (decision model root)
      - id: dmn:Decision
        label: Decision
      - id: dmn:DecisionTable
        label: Decision Table
      - id: dmn:BusinessKnowledgeModel
        label: Business Knowledge Model
      - id: dmn:InputData
        label: Input Data
      - id: dmn:KnowledgeSource
        label: Knowledge Source
      - id: dmn:InformationRequirement
        label: Information Requirement
      - id: dmn:LiteralExpression
