      - kind: http-json
        url: https://api.github.com/repos/bian-official/public/contents/
        note: Public BIAN GitHub content listing (OpenAPI / ArchiMate extracts)
    keyClasses:
      - id: bian:BusinessArea
        label: Business Area
      - id: bian:BusinessDomain
        label: Business Domain
      - id: bian:ServiceDomain
        label: Service Domain
      - id: bian:BusinessCapability
        label: Business Capability
      - id: bian:ControlRecord
        label: Control Record
      - id: bian:ServiceOperation
        label: Service Operation
      - id: bian:BehavioralView
        label: Behavioral View

  - id: dora
    label: DORA Metrics Taxonomy (DevOps Research & Assessment)
    steward: DORA / Google Cloud
    formats: [JSON Schema, Metric Spec]
    integration: registered
    domains: [eng_health]
    coverage: >
      Quantifies software delivery performance and operational stability via
      four key metrics: Deployment Frequency, Lead Time for Changes, Change
      Failure Rate, and Time to Restore Service (MTTR).
    scrape:
      - kind: http-html
        url: https://dora.dev/guides/dora-metrics/
