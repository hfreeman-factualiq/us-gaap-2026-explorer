      - id: issb:RiskManagement
        label: Risk Management (TCFD/ISSB pillar)
      - id: issb:MetricsAndTargets
        label: Metrics and Targets (TCFD/ISSB pillar)

signalDomains:
  - id: income_statement
    order: 1
    label: Income Statement
    description: Statutory earnings lines plus the spend splits underwriting cares about.
    primaryStandards: [us-gaap-xbrl, xbrl-gl]
    signals:
      - key: rev
        label: Revenue
        gaap: [RevenueFromContractWithCustomerExcludingAssessedTax, Revenues]
        classes: [us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax]
      - key: cogs
        label: Cost of Revenue
        gaap: [CostOfGoodsAndServicesSold, CostOfRevenue]
        classes: [us-gaap:CostOfGoodsAndServicesSold]
      - key: opex
        label: Operating Expenses
        gaap: [OperatingExpenses]
        classes: [gl-cor:entryDetail]
      - key: sm_spend
        label: Sales & Marketing Spend
        gaap: [SellingAndMarketingExpense]
        classes: [us-gaap:SellingAndMarketingExpense]
      - key: rd_spend
        label: R&D Spend
        gaap: [ResearchAndDevelopmentExpense]
        classes: [us-gaap:ResearchAndDevelopmentExpense]
      - key: ga_spend
        label: G&A Spend
        gaap: [GeneralAndAdministrativeExpense]
        classes: [us-gaap:GeneralAndAdministrativeExpense]
      - key: sbc
        label: Stock-Based Compensation
        gaap: [AllocatedShareBasedCompensationExpense, ShareBasedCompensation]
        classes: [us-gaap:AllocatedShareBasedCompensationExpense]
      - key: ebitda
        label: EBITDA
        nongaap: [nongaap:EBITDA, nongaap:AdjustedEBITDA]
        classes: [xbrl:CalculationLinkbase, fibo-fnd-acc-cur:MonetaryAmount]
      - key: restatements
        label: Restatements
        gaap: [PriorPeriodReclassificationAdjustment]
        classes: [sec:AccountingChangeDisclosure, gl-cor:entryType]

  - id: unit_economics
    order: 2
    label: Unit Economics
    description: Non-GAAP SaaS ratios codified by community schemas and FIBO contract terms.
    primaryStandards: [open-saas, fibo]
    signals:
      - key: arr
        label: Annual Recurring Revenue
        nongaap: [nongaap:ARR]
        classes: [opensaas:AnnualRecurringRevenue, fibo-fnd-agr-ctr:RecurringPayment]
      - key: rev_mix
        label: Revenue Mix
        gaap: [RevenueFromContractWithCustomerExcludingAssessedTax]
        classes: [opensaas:RevenueMix]
      - key: cac
        label: Customer Acquisition Cost
        gaap: [SellingAndMarketingExpense]
        classes: [opensaas:CustomerAcquisitionCost]
      - key: cac_payback
        label: CAC Payback
        classes: [opensaas:CACPayback]
      - key: ltv_cac
        label: LTV / CAC
        classes: [opensaas:LTV_CAC_Ratio]
      - key: burn_mult
        label: Burn Multiple
        nongaap: [nongaap:CashBurn]
        classes: [opensaas:BurnMultiple]
      - key: magic_no
        label: Magic Number
        gaap: [SellingAndMarketingExpense]
        classes: [opensaas:MagicNumber, xbrl:CalculationLinkbase]

  - id: cash_flow
    order: 3
    label: Cash Flow & Runway
    description: GAAP cash flow sections plus contract-level simulation for runway and debt service.
    primaryStandards: [actus, us-gaap-xbrl]
    signals:
      - key: burn
        label: Cash Burn
        nongaap: [nongaap:CashBurn, nongaap:CashBurnCapEx]
        classes: [us-gaap:NetCashProvidedByUsedInOperatingActivities]
      - key: norm_burn
        label: Normalized Burn
        nongaap: [nongaap:CashBurn]
        classes: [gl-cor:entryType]
      - key: runway
        label: Runway
        classes: [actus:PAM, actus:CycleOfPrincipalRedemption]
      - key: ocf
        label: Operating Cash Flow
        gaap: [NetCashProvidedByUsedInOperatingActivities]
        classes: [us-gaap:NetCashProvidedByUsedInOperatingActivities]
      - key: capex
        label: Capital Expenditures
        gaap: [PaymentsToAcquirePropertyPlantAndEquipment]
        classes: [us-gaap:PaymentsToAcquirePropertyPlantAndEquipment]
      - key: fin_flows
        label: Financing Flows
        gaap: [NetCashProvidedByUsedInFinancingActivities]
        classes: [actus:IED, actus:PR]
      - key: debt_svc
        label: Debt Service
        gaap: [InterestAndDebtExpense, InterestExpense]
        classes: [actus:IP, actus:NominalInterestRate, actus:LAM]

  - id: balance_sheet
    order: 4
    label: Balance Sheet
    description: Position lines plus the open equity/cap-table schema for dilution events.
    primaryStandards: [ocf, fibo, us-gaap-xbrl]
    signals:
      - key: cash
        label: Cash & Equivalents
        gaap: [CashAndCashEquivalentsAtCarryingValue]
      - key: ar
        label: Accounts Receivable
        gaap: [AccountsReceivableNetCurrent]
        classes: [us-gaap:AccountsReceivableNetCurrent]
      - key: ap
        label: Accounts Payable
        gaap: [AccountsPayableCurrent]
      - key: dso
        label: Days Sales Outstanding
        gaap: [AccountsReceivableNetCurrent]
        classes: [xbrl:CalculationLinkbase]
      - key: dr_bal
        label: Deferred Revenue Balance
        gaap: [ContractWithCustomerLiability, DeferredRevenue]
        classes: [us-gaap:DeferredRevenue]
      - key: billings
        label: Billings
        gaap: [ContractWithCustomerLiability]
        classes: [opensaas:AnnualRecurringRevenue]
      - key: debt_sched
        label: Debt Schedule
        gaap: [LongTermDebt, LongTermDebtAndCapitalLeaseObligations]
        classes: [fibo-fbc-dae-dbt:DebtInstrument, actus:PAM, actus:NotionalPrincipal]
      - key: equity_events
        label: Equity Events (SAFEs, notes, options)
        gaap: [StockholdersEquity]
        classes:
          - ocf:StockIssuance
          - ocf:ConvertibleIssuance
          - ocf:WarrantIssuance
          - ocf:StockPlan
          - fibo-fbc-dae-eq:EquityInstrument

  - id: commercial_pipeline
    order: 5
    label: Commercial & Pipeline
    description: Sales process and retention KPIs codified by APQC PCF and schema.org commerce types.
    primaryStandards: [apqc-pcf, schema-org]
    signals:
      - key: bookings
        label: Bookings
        classes: [apqc:Process_3_5_0, schema:Order]
      - key: pipeline
        label: Pipeline
        classes: [apqc:Process_3_2_2, schema:Demand]
      - key: logos
        label: Customer Logos
        classes: [schema:Organization]
      - key: grr
        label: Gross Revenue Retention
        classes: [apqc:KPI_CustomerRetentionRate]
      - key: nrr
        label: Net Revenue Retention
        nongaap: [nongaap:NetRevenueRetention]
        classes: [opensaas:NetRevenueRetention, apqc:KPI_CustomerRetentionRate]
      - key: acv
        label: Average Contract Value
        classes: [schema:PriceSpecification, fibo-fnd-agr-ctr:RecurringPayment]
      - key: sales_cycle
        label: Sales Cycle Length
        classes: [apqc:KPI_SalesCycleTime]
      - key: win_rate
        label: Win Rate
        classes: [apqc:KPI_WinRate, schema:SellAction]

  - id: team_headcount
    order: 6
    label: Team & Headcount
    description: Org structure as triples (W3C ORG) with ISO 30414 workforce metric definitions.
    primaryStandards: [w3c-org, iso-30414]
    signals:
      - key: headcount
        label: Headcount
        gaap: [LaborAndRelatedExpense]
        classes: [iso30414:FullTimeEquivalent_FTE, org:Membership]
      - key: hc_plan
        label: Headcount Plan
        classes: [org:Post, gl-bus:budgetVersion]
      - key: leadership_events
        label: Leadership Events
        classes: [org:headOf, org:Post, iso30414:LeadershipDepth]
      - key: vacancies
        label: Vacancies
        classes: [iso30414:VacancyRate, iso30414:TimeToFillVacantPositions, org:Post]
      - key: attrition
        label: Attrition
        classes: [iso30414:TurnoverRate, iso30414:CriticalPositionTurnover]
      - key: reorg_events
        label: Reorg Events
        classes: [org:ChangeEvent, org:hasSubOrganization, org:reportsTo]

  - id: external_events
    order: 7
    label: External Events
    description: Competitive, pricing, regulatory and partnership events typed by FIBO/FRO and ArchiMate.
    primaryStandards: [fibo, fro, archimate]
    signals:
      - key: comp_events
        label: Competitive Events
        classes: [archimate:BusinessActor, archimate:BusinessEvent]
      - key: pricing_events
        label: Pricing Events
        classes: [archimate:Product, schema:PriceSpecification, schema:Offer]
      - key: reg_events
        label: Regulatory Events
        classes: [fibo-fbc-fbc:RegulatoryAgency, fro:Regulation, archimate:Constraint]
      - key: partner_events
        label: Partnership Events
        classes: [archimate:Contract, fibo-be-le-lp:LegalEntity]
      - key: market_claims
        label: Market Claims
        classes: [archimate:Assessment, archimate:Driver]

  - id: plan_forecast
    order: 8
    label: Plan & Forecast
    description: >
      Plan vs actual variance modelling. XBRL GL attaches entryType, budget version and
      scenario flags to any GL concept, so variance is standardized across any chart of accounts.
    primaryStandards: [xbrl-gl]
    signals:
      - key: plan_rev
        label: Planned Revenue
        gaap: [RevenueFromContractWithCustomerExcludingAssessedTax]
        classes: [gl-cor:entryType, gl-bus:budgetVersion]
      - key: plan_opex
        label: Planned Operating Expenses
        gaap: [OperatingExpenses]
        classes: [gl-cor:entryType, gl-cor:accountMainID]
      - key: plan_burn
        label: Planned Burn
        nongaap: [nongaap:CashBurn]
        classes: [gl-cor:entryType]
      - key: milestones
        label: Milestones
        classes: [gl-cor:postingDate, archimate:BusinessEvent]
      - key: rf_versions
        label: Re-forecast Versions
        classes: [gl-bus:budgetVersion, gl-cor:entryHeader]
      - key: variances
        label: Plan vs Actual Variances
        classes: [gl-cor:entryType, xbrl:CalculationLinkbase]

  - id: reporting_narrative
    order: 9
    label: Reporting & Narrative
    description: >
      Footnotes, accounting changes and MD&A claims mapped to source paragraphs via
      iXBRL tuple structures and FIBO provenance concepts.
    primaryStandards: [sec-ixbrl, fibo]
    signals:
      - key: gl_anomalies
        label: GL Anomalies
        classes: [gl-cor:entryDetail, gl-cor:entryType]
      - key: reclass_events
        label: Reclassification Events
        gaap: [PriorPeriodReclassificationAdjustment]
        classes: [sec:AccountingChangeDisclosure, gl-cor:accountMainID]
      - key: coa_changes
        label: Chart of Accounts Changes
        classes: [gl-cor:accountMainID, gl-cor:entryHeader]
      - key: report_lag
        label: Reporting Lag
        classes: [dei:DocumentPeriodEndDate, gl-cor:postingDate]
      - key: mdna_claims
        label: MD&A Claims
        classes: [sec:MDandASection, ixbrl:FootnoteTuple, fibo-fnd-acc-aeq:FinancialReport]

  - id: impact_outcomes
    order: 10
    label: Impact & Outcomes
    description: Impact underwriting via IRIS+ metric codes and the IMP five dimensions.
    primaryStandards: [iris-plus, imp]
    signals:
      - key: reach
        label: Reach
        classes: [iris:PI4060, imp:Who]
      - key: outcomes
        label: Outcomes
        classes: [iris:OI1234, imp:What]
      - key: underserved_share
        label: Underserved Share
        classes: [iris:PI4060, imp:Who]
      - key: cost_per_outcome
        label: Cost per Outcome
        classes: [iris:CostPerOutcome, imp:HowMuch]
      - key: memo_impact_path
        label: Memo Impact Path
        classes: [imp:Contribution, imp:Risk, iris:PD_ProductDescription]

  # ---- v1.31 signal domains -------------------------------------------------------

  - id: strategy_motivation
    order: 11
    label: Strategy & Motivation
    description: >
      The why of the business — vision through policies — so operational actions
      can be checked for strategic alignment (BMM).
    primaryStandards: [bmm]
    signals:
      - key: vision
        label: Vision
        classes: [bmm:Vision]
      - key: mission
        label: Mission
        classes: [bmm:Mission]
      - key: strategy
        label: Strategy
        classes: [bmm:Strategy]
      - key: tactics
        label: Tactics
        classes: [bmm:Tactic]
      - key: goals
        label: Goals
        classes: [bmm:Goal]
      - key: objectives
        label: Objectives
        classes: [bmm:Objective]
      - key: business_policies
        label: Business Policies
        classes: [bmm:BusinessPolicy, bmm:BusinessRule]
      - key: influencers
        label: Influencers & Assessments
        classes: [bmm:Influencer, bmm:Assessment, archimate:Driver]

  - id: decision_logic
    order: 12
    label: Decision Logic & Rules
    description: >
      Formal operational decision-making — DRDs, decision tables and FEEL
      expressions that automate or audit complex business choices (DMN).
    primaryStandards: [dmn]
    signals:
      - key: decisions
        label: Decisions
        classes: [dmn:Decision]
      - key: decision_tables
        label: Decision Tables
        classes: [dmn:DecisionTable, dmn:HitPolicy]
      - key: input_data
        label: Input Data
        classes: [dmn:InputData]
      - key: business_knowledge
        label: Business Knowledge Models
        classes: [dmn:BusinessKnowledgeModel, dmn:KnowledgeSource]
      - key: feel_expressions
        label: FEEL Expressions
        classes: [dmn:LiteralExpression]
      - key: information_requirements
        label: Information Requirements
        classes: [dmn:InformationRequirement]

  - id: value_streams
    order: 13
    label: Value Creation Streams
    description: >
      How capabilities and activities create and exchange economic value across
      departments and partners (VDML).
