<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Financial Ontology 2026 — GAAP + Non-GAAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e8eef2;
      --panel: #f7fafc;
      --ink: #15202b;
      --muted: #5a6b78;
      --line: #c5d2dc;
      --accent: #0b6e6a;
      --accent-soft: #d3ebe9;
      --standalone: #1f6b3a;
      --standalone-bg: #e4f2e8;
      --group: #3d5a40;
      --group-bg: #e5eee6;
      --formula: #1e4d8c;
      --formula-bg: #dde8f5;
      --tagged: #6b2d7b;
      --tagged-bg: #f0e3f4;
      --ratio: #9b1d4a;
      --ratio-bg: #f7e0e8;
      --meta: #4a5560;
      --meta-bg: #e6e9ec;
      --font: "IBM Plex Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: linear-gradient(180deg, #eef3f6, var(--bg));
    }
    .app {
      max-width: 1400px;
      margin: 0 auto;
      height: 100%;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 8px;
      padding: 10px 12px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    header h1 span { color: var(--accent); }
    .stats { display: flex; flex-wrap: wrap; gap: 6px; }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .stat b { color: var(--ink); }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .toolbar input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      outline: none;
    }
    .toolbar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .modes { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .modes button, .chip {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 12px;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
    }
    .modes button.active, .chip.active {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }
    .tree-select {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 12px;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--ink);
      background: #fff;
      max-width: 260px;
    }
    .tree-select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .download-group {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .download-group button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
    }
    .download-group button:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .badge.populated { background: #e4f2e8; color: #1f6b3a; }
    .badge.derived-co { background: #dde8f5; color: #1e4d8c; }

    .main {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.1fr);
      gap: 12px;
      min-height: 0;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .panel-h {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .panel-h h2 { margin: 0; font-size: 1rem; }
    .panel-h .hint { margin-top: 3px; font-size: 0.75rem; color: var(--muted); }
    .panel-b { overflow: auto; padding: 10px; flex: 1; }

    .tree details { margin: 0; }
    .tree details details { margin-left: 14px; border-left: 1px solid var(--line); padding-left: 6px; }
    .tree summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 7px 8px;
      border-radius: 8px;
      font-size: 0.88rem;
    }
    .tree summary::-webkit-details-marker { display: none; }
    .tree summary:hover, .row:hover, .hit:hover { background: #e4ebf0; }
    .tree summary.selected, .row.selected, .hit.selected {
      background: var(--accent-soft);
      outline: 1px solid #9ecfcf;
    }
    .twist {
      width: 14px;
      flex: 0 0 auto;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.75rem;
      margin-top: 2px;
    }
    details[open] > summary > .twist { transform: rotate(90deg); }
    .node-main { min-width: 0; flex: 1; }
    .node-label { display: block; font-weight: 500; }
    .node-name {
      display: block;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .leaf {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 7px 8px 7px 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      white-space: nowrap;
      margin-top: 2px;
    }
    .badge.standalone { background: var(--standalone-bg); color: var(--standalone); }
    .badge.group, .badge.group-formula { background: var(--group-bg); color: var(--group); }
    .badge.formula { background: var(--formula-bg); color: var(--formula); }
    .badge.tagged { background: var(--tagged-bg); color: var(--tagged); }
    .badge.ratio { background: var(--ratio-bg); color: var(--ratio); }
    .badge.residual, .badge.abstract, .badge.meta { background: var(--meta-bg); color: var(--meta); }
    .badge.derived { background: #f5e6d8; color: #8a4b16; }
    .badge.rule { background: #e8e4f5; color: #4a3a7a; }
    .badge.fibo { background: #dcecf5; color: #1a5f7a; }
    .badge.root { background: var(--accent-soft); color: var(--accent); }
    .badge.discovery { background: #e8f0e4; color: #3d5c2e; }
    .badge.gap { background: #f7e8e0; color: #8a3a1a; }

    .hits { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .hit, .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .hit .title, .row .title { font-size: 0.88rem; font-weight: 500; }
    .hit .sub, .row .sub {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .detail .kicker {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
    }
    .detail h3 { margin: 4px 0 4px; font-size: 1.25rem; line-height: 1.25; }
    .detail .cname {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--accent);
      word-break: break-all;
      margin-bottom: 8px;
    }
    .summary {
      background: var(--accent-soft);
      border: 1px solid #b7d9d9;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.86rem;
      margin: 10px 0;
    }
    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .meta-box {
      border-radius: 8px;
      padding: 8px 10px;
      border: 1px solid transparent;
    }
    .meta-box .lbl {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 600;
      opacity: 0.75;
    }
    .meta-box .val {
      font-weight: 600;
      font-size: 0.86rem;
      margin-top: 3px;
      word-break: break-word;
    }
    .meta-box.role { background: var(--accent-soft); color: var(--accent); border-color: #b7d9d9; }
    .meta-box.type { background: var(--formula-bg); color: var(--formula); border-color: #b7c9e0; }
    .meta-box.period { background: var(--tagged-bg); color: var(--tagged); border-color: #d8c0e0; }
    .meta-box.balance { background: var(--standalone-bg); color: var(--standalone); border-color: #b7d4c0; }
    .doc {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 0.86rem;
      margin-bottom: 12px;
    }
    .section { margin-top: 14px; }
    .section h4 { margin: 0 0 4px; font-size: 0.9rem; }
    .section .sec-hint { margin: 0 0 8px; font-size: 0.74rem; color: var(--muted); }
    .formula {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .formula-h {
      padding: 6px 10px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--muted);
      background: #e8eef2;
      border-top: 1px solid var(--line);
    }
    .formula-h:first-child { border-top: 0; }
    .formula-row {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 8px;
      padding: 8px 10px;
      border-top: 1px solid var(--line);
      cursor: pointer;
      font-size: 0.86rem;
    }
    .formula-row:hover { background: #e4ebf0; }
    .weight { font-family: var(--mono); color: var(--formula); font-size: 0.78rem; font-weight: 500; }
    .equation {
      background: #fff;
      border: 1px solid var(--line);
      border-left: 4px solid var(--formula);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      font-size: 0.92rem;
      line-height: 1.55;
    }
    .equation .eq-net {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .equation .eq-line { word-break: break-word; }
    .equation .eq-left { font-weight: 600; }
    .equation .eq-op { color: var(--muted); margin: 0 0.35em; font-weight: 500; }
    .equation .eq-term {
      color: var(--formula);
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: #b7c9e0;
      text-underline-offset: 2px;
    }
    .equation .eq-term:hover { color: var(--accent); text-decoration-color: var(--accent); }
    .equation .eq-coef { font-family: var(--mono); font-size: 0.85em; color: var(--muted); }
    .side { font-size: 0.65rem; color: var(--muted); text-align: right; }
    .empty { color: var(--muted); text-align: center; padding: 28px 12px; }
    .error {
      color: #7a1f1f;
      max-width: 520px;
      margin: 24px auto;
      background: #fff;
      border: 1px solid #e0b4b4;
      border-radius: 12px;
      padding: 20px;
      font-weight: 400;
    }
    @media (max-width: 900px) {
      .main, .toolbar { grid-template-columns: 1fr; }
      .panel { max-height: 55vh; }
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <header>
      <h1>Financial Ontology <span>2026</span></h1>
      <label class="stat" style="display:inline-flex;align-items:center;gap:8px;border-radius:999px;">
        <span style="font-size:0.75rem;color:var(--muted)">Tree</span>
        <select id="tree-source" class="tree-select" title="Select ontology or company tree"></select>
      </label>
      <div class="download-group" title="Download the currently loaded tree">
        <button type="button" id="dl-json">Download JSON</button>
        <button type="button" id="dl-csv">Download CSV</button>
      </div>
      <div class="stats" id="stats"></div>
    </header>

    <div class="toolbar">
      <input id="q" type="search" placeholder="Search statements, metrics, GAAP tags…" autocomplete="off" />
      <div class="modes" id="modes">
        <button type="button" class="active" data-mode="presentation">Tree</button>
        <button type="button" data-mode="formula">Formulas</button>
        <button type="button" data-mode="subtypes">Class</button>
        <button type="button" data-mode="usedby">Used by</button>
        <button type="button" data-mode="nongaap">Metrics</button>
        <button type="button" data-mode="discovery">Reference</button>
      </div>
    </div>

    <div class="main">
      <section class="panel">
        <div class="panel-h">
          <h2>Tree</h2>
          <div class="hint" id="tree-hint">Unified forest — click ▸ to expand</div>
        </div>
        <div class="panel-b">
          <div id="search-hits" class="hits" hidden></div>
          <div id="tree" class="tree"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-h">
          <h2>Relationships</h2>
          <div class="hint">presentation · formulas · Non-GAAP · rules</div>
        </div>
        <div class="panel-b" id="detail">
          <div class="empty">Select a concept.</div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const ROLE = {
      atomic: { id: "standalone", label: "Standalone" },
      total: { id: "formula", label: "Has formula" },
      "class+total": { id: "group-formula", label: "Group + formula" },
      class: { id: "group", label: "Broader type" },
      dimensional: { id: "tagged", label: "Tagged form" },
      ratio: { id: "ratio", label: "Ratio" },
      aggregate: { id: "residual", label: "Has residual" },
      abstract: { id: "abstract", label: "Abstract" },
      meta: { id: "meta", label: "Meta" },
      derived: { id: "derived", label: "Non-GAAP" },
      rule: { id: "rule", label: "SEC C&DI" },
      fibo: { id: "fibo", label: "FIBO" },
      root: { id: "root", label: "Root" },
      discovery: { id: "discovery", label: "Discovery" },
      gap: { id: "gap", label: "Gap" },
    };

    const CHILD_LIMIT = 60;
    const PREFERRED_NETS = new Set([
      "StatementOfFinancialPositionClassified",
      "StatementOfIncome",
      "StatementOfCashFlowsIndirect",
      "StatementOfShareholdersEquityAndOtherComprehensiveIncome",
      "ClassSubclass",
      "NonGAAP",
      "NonGAAPCategory",
      "DerivedFrom",
      "Governs",
      "AlignsTo",
      "FIBO",
      "SEC_CDI",
      "Discovery",
      "DiscoverySource",
      "MapsTo",
      "Gap",
    ]);
    const state = {
      data: null,
      selected: null,
      mode: "presentation", // presentation | subtypes | formula | usedby | nongaap | discovery
      open: new Set(),
      query: "",
      netFilter: null, // optional presentation network filter
      catalog: [],
      sourceId: "v1.2",
    };

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const escAttr = (s) => esc(s).replace(/'/g, "&#39;");

    function concept(name) {
      return state.data.concepts[name];
    }
    function labelOf(name) {
      const c = concept(name);
      return (c && c.l) || name;
    }
    function roleOf(c) {
      return ROLE[c?.k] || { id: "standalone", label: c?.k || "Concept" };
    }
    function badge(c) {
      const r = roleOf(c);
      let html = `<span class="badge ${r.id}">${r.label}</span>`;
      if (c?.companyGap) html += ` <span class="badge gap">Gap add</span>`;
      if (c?.companyDerived) html += ` <span class="badge derived-co">Derived</span>`;
      else if (c?.companyPopulated) html += ` <span class="badge populated">Reported</span>`;
      return html;
    }

    function uniqueCalc(list) {
      const seen = new Set();
      const out = [];
      for (const item of list || []) {
        if (seen.has(item.c)) continue;
        seen.add(item.c);
        out.push(item);
      }
      return out;
    }

    function uniquePre(list, netFilter) {
      const seen = new Set();
      const out = [];
      const items = list || [];
      const preferredPresent = items.some((x) => x.net && PREFERRED_NETS.has(x.net));
      for (const item of items) {
        if (netFilter && item.net && item.net !== netFilter) continue;
        if (!netFilter && preferredPresent && item.net && !PREFERRED_NETS.has(item.net)) continue;
        if (seen.has(item.c)) continue;
        seen.add(item.c);
        out.push(item);
      }
      return out;
    }

    function childrenOf(name) {
      const c = concept(name);
      if (!c) return [];
      if (state.mode === "formula") return uniqueCalc(c.cc).map((x) => x.c);
      if (state.mode === "usedby") return uniqueCalc(c.cp).map((x) => x.c);
      if (state.mode === "subtypes") {
        if (c.sc?.length) return c.sc;
        return uniquePre(c.tc || c.pc).map((x) => x.c);
      }
      if (state.mode === "nongaap") {
        if (
          c.layer === "nongaap" ||
          c.layer === "rule" ||
          c.n === "root:Metrics" ||
          c.n === "root:NonGAAP" ||
          c.n?.startsWith("nongaap:") ||
          c.n?.startsWith("metrics:") ||
          c.n?.startsWith("ea:metric:")
        ) {
          return uniquePre(c.tc || c.pc).map((x) => x.c);
        }
        return (c.fo || []).slice();
      }
      if (state.mode === "discovery") {
        if (
          c.layer === "discovery" ||
          c.n === "root:Discovery" ||
          c.n === "root:Reference" ||
          c.n?.startsWith("discovery:") ||
          c.n?.startsWith("reference:")
        ) {
          return uniquePre(c.tc || c.pc).map((x) => x.c);
        }
        return (c.discoveredBy || []).slice();
      }
      // presentation (default): prefer curated tree children
      if (c.tc?.length) return uniquePre(c.tc, state.netFilter).map((x) => x.c);
      return uniquePre(c.pc, state.netFilter).map((x) => x.c);
    }

    function renderStats() {
      const s = state.data.summary || {};
      const meta = state.data.meta || {};
      const items = meta.companyTree
        ? [
            ["Concepts", s.ontologyNodes ?? Object.keys(state.data.concepts || {}).length],
            ["Populated", meta.populatedCount],
            ["Gaps added", meta.gapCount],
            ["Derived", meta.derivedCount],
            ["Mapped labels", s.companyMappedLabels],
          ]
        : [
            ["Concepts", s.totalConcepts],
            ["Roots", s.forestRoots],
            ["Metrics", s.nongaapMetrics],
            ["Discovery", s.discoveryNodes],
            ["Gaps", s.discoveryGaps],
            ["C&DIs", s.secRules],
          ];
      $("stats").innerHTML = items
        .filter(([, v]) => v != null)
        .map(([k, v]) => `<div class="stat"><b>${Number(v).toLocaleString()}</b> ${k}</div>`)
        .join("") + (meta.company ? `<div class="stat"><b>${esc(meta.company)}</b></div>` : "");
    }

    function linkRow(name, extra = "") {
      return `<div class="row" data-go="${escAttr(name)}">
        <div>
          <div class="title">${esc(labelOf(name))}</div>
          <div class="sub">${esc(name)}</div>
        </div>
        <div>${extra}</div>
      </div>`;
    }

    function summarize(c) {
      const bits = [];
      if (c.layer && c.layer !== "gaap") bits.push(`layer <em>${esc(c.layer)}</em>`);
      if (c.expression) bits.push(`expression <strong>${esc(c.expression)}</strong>`);
      if (c.sp?.length) bits.push(`grouped under <em>${c.sp.map(labelOf).map(esc).join("</em>, <em>")}</em>`);
      if (c.sc?.length) bits.push(`broader type for <strong>${c.sc.length}</strong> subtypes`);
      if (c.pc?.length) bits.push(`presents <strong>${uniquePre(c.pc).length}</strong> child line item(s)`);
      if (c.cc?.length) bits.push("built from a calculation formula");
      if (c.de?.length) bits.push(`tagged form of <em>${esc(labelOf(c.de[0]))}</em>`);
      if (c.num?.length || c.den?.length) bits.push("defined as a ratio");
      if (c.df?.length) bits.push(`derived from <strong>${c.df.length}</strong> input(s)`);
      if (c.mapsTo?.length) bits.push(`maps to <strong>${c.mapsTo.length}</strong> GAAP tag(s)`);
      if (c.discoveredBy?.length) bits.push(`referenced by <strong>${c.discoveredBy.length}</strong> discovery node(s)`);
      if (c.gap) bits.push("<strong>coverage gap</strong>");
      if (c.fo?.length) bits.push(`input to <strong>${c.fo.length}</strong> Non-GAAP metric(s)`);
      if (c.secCaveats?.length) bits.push(`governed by <strong>${c.secCaveats.length}</strong> SEC C&DI(s)`);
      if (c.cp?.length) bits.push(`used by <strong>${uniqueCalc(c.cp).length}</strong> other concept(s)`);
      if (!bits.length) {
        return c.f?.atomic
          ? `<div class="summary"><strong>Standalone.</strong> No formula, subtypes, tagged form, or ratio parts here.</div>`
          : `<div class="summary">No grouping or composition links found for this concept.</div>`;
      }
      return `<div class="summary"><strong>How it relates:</strong> ${bits.join("; ")}.</div>`;
    }

    function section(title, hint, html) {
      if (!html) return "";
      return `<div class="section"><h4>${title}</h4><p class="sec-hint">${hint}</p>${html}</div>`;
    }

    function termLink(name) {
      return `<span class="eq-term" data-go="${escAttr(name)}" title="${escAttr(name)}">${esc(labelOf(name))}</span>`;
    }

    function formatSignedTerm(item, isFirst) {
      const abs = Math.abs(item.w);
      const coef = abs !== 1 ? `<span class="eq-coef">${abs} × </span>` : "";
      const term = `${coef}${termLink(item.c)}`;
      if (isFirst) {
        return item.w < 0 ? `<span class="eq-op">−</span> ${term}` : term;
      }
      return item.w < 0
        ? `<span class="eq-op">−</span> ${term}`
        : `<span class="eq-op">+</span> ${term}`;
    }

    /** Group calc children by network; dedupe within each network. */
    function formulasByNetwork(c) {
      const byNet = new Map();
      for (const item of c.cc || []) {
        if (!byNet.has(item.net)) byNet.set(item.net, []);
        const list = byNet.get(item.net);
        if (list.some((x) => x.c === item.c)) continue;
        list.push(item);
      }
      return byNet;
    }

    function prettyNet(net) {
      return String(net || "")
        .replace(/([a-z])([A-Z])/g, "$1 $2")
        .replace(/([A-Z]+)([A-Z][a-z])/g, "$1 $2")
        .replace(/[-_]/g, " ");
    }

    function renderEquations(parentName, c) {
      const byNet = formulasByNetwork(c);
      if (!byNet.size) return "";
      let html = "";
      for (const [net, parts] of byNet) {
        const rhs = parts.map((item, i) => formatSignedTerm(item, i === 0)).join(" ");
        html += `<div class="equation">
          <span class="eq-net">${esc(prettyNet(net))}</span>
          <div class="eq-line">
            <span class="eq-left">${esc(labelOf(parentName))}</span>
            <span class="eq-op">=</span>
            ${rhs}
          </div>
        </div>`;
      }
      return html;
    }

    function renderRatioEquation(c) {
      if (!c.num?.length && !c.den?.length) return "";
      const nums = (c.num || []).map(termLink).join(' <span class="eq-op">+</span> ');
      const dens = (c.den || []).map(termLink).join(' <span class="eq-op">+</span> ');
      return `<div class="equation">
        <span class="eq-net">Ratio</span>
        <div class="eq-line">
          <span class="eq-left">${esc(c.l || c.n)}</span>
          <span class="eq-op">=</span>
          (${nums || "?"}) <span class="eq-op">/</span> (${dens || "?"})
        </div>
      </div>`;
    }

    function renderDerivedFormula(c) {
      if (!c.formula && !c.expression) return "";
      const expr = c.expression ? `<div class="eq-line"><span class="eq-left">${esc(c.l || c.n)}</span> <span class="eq-op">=</span> ${esc(c.expression)}</div>` : "";
      const ast = c.formula ? `<div class="doc" style="margin-top:8px"><code>${esc(JSON.stringify(c.formula))}</code></div>` : "";
      const inputs = (c.df || []).map((n) => linkRow(n, `<span class="side">input</span>`)).join("");
      return `<div class="equation"><span class="eq-net">Non-GAAP formula</span>${expr}${ast}</div>` +
        (inputs ? `<div class="hits">${inputs}</div>` : "");
    }

    function renderRules(c) {
      const ids = c.secCaveats || c.governs || [];
      if (!ids.length && !c.answer) return "";
      let html = "";
      if (c.question) html += `<div class="doc"><strong>Q:</strong> ${esc(c.question)}</div>`;
      if (c.answer) html += `<div class="doc"><strong>A:</strong> ${esc(c.answer)}</div>`;
      if (c.sourceUrl) html += `<div class="sec-hint"><a href="${escAttr(c.sourceUrl)}" target="_blank" rel="noopener">SEC source</a></div>`;
      if (ids.length) {
        html += `<div class="hits">${ids.map((n) => linkRow(n, `<span class="side">link</span>`)).join("")}</div>`;
      }
      return html;
    }

    function renderDetail(name) {
      const c = concept(name);
      const el = $("detail");
      if (!c) {
        el.innerHTML = `<div class="empty">Concept not found.</div>`;
        return;
      }
      state.selected = name;
      const role = roleOf(c);

      const formulaHtml = renderEquations(name, c) + renderRatioEquation(c) + renderDerivedFormula(c);

      let built = "";
      if (c.de?.length) {
        const roles = ["Base concept", "Axis", "Member", "Other"];
        built += `<div class="hits">` + c.de.map((n, i) =>
          linkRow(n, `<span class="side">${roles[i] || "Part"}</span>`)
        ).join("") + `</div>`;
      }
      if (c.num?.length || c.den?.length) {
        built += `<div class="hits">`;
        (c.num || []).forEach((n) => (built += linkRow(n, `<span class="side">numerator</span>`)));
        (c.den || []).forEach((n) => (built += linkRow(n, `<span class="side">denominator</span>`)));
        built += `</div>`;
      }
      if (c.cc?.length) {
        const byNet = formulasByNetwork(c);
        built += `<div class="formula">`;
        for (const [net, parts] of byNet) {
          built += `<div class="formula-h">${esc(net)}</div>`;
          for (const item of parts) {
            const sign = item.w < 0 ? String(item.w) : `+${item.w}`;
            built += `<div class="formula-row" data-go="${escAttr(item.c)}">
              <div class="weight">${sign}</div>
              <div>
                <div>${esc(labelOf(item.c))}</div>
                <div class="sub">${esc(item.c)}</div>
              </div>
            </div>`;
          }
        }
        built += `</div>`;
      }

      const used = uniqueCalc(c.cp);
      let usedHtml = used.length
        ? `<div class="hits">${used.map((x) => linkRow(x.c, badge(concept(x.c)))).join("")}</div>`
        : "";

      let groupHtml = "";
      if (c.sp?.length || c.sc?.length) {
        groupHtml = `<div class="hits">`;
        (c.sp || []).forEach((n) => (groupHtml += linkRow(n, `<span class="side">broader</span>`)));
        (c.sc || []).forEach((n) => (groupHtml += linkRow(n, `<span class="side">narrower</span>`)));
        groupHtml += `</div>`;
      }

      const preKids = uniquePre(c.tc || c.pc);
      const preHtml = preKids.length
        ? `<div class="hits">${preKids.slice(0, 40).map((x) => linkRow(x.c, `<span class="side">${esc(x.net || "")}</span>`)).join("")}</div>`
        : "";

      const foHtml = c.fo?.length
        ? `<div class="hits">${c.fo.map((n) => linkRow(n, `<span class="side">uses this</span>`)).join("")}</div>`
        : "";

      const discHtml = c.discoveredBy?.length
        ? `<div class="hits">${c.discoveredBy.slice(0, 40).map((n) => linkRow(n, `<span class="side">discovery</span>`)).join("")}</div>`
        : "";

      const mapsHtml = c.mapsTo?.length
        ? `<div class="hits">${c.mapsTo.map((n) => linkRow(n, `<span class="side">mapsTo</span>`)).join("")}</div>`
        : "";

      const alignsHtml = (c.alignsTo || c.fiboAligned || []).length
        ? `<div class="hits">${(c.alignsTo || []).map((n) => linkRow(n, `<span class="side">aligns</span>`)).join("")}${(c.fiboAligned || []).map((n) => linkRow(n, `<span class="side">FIBO</span>`)).join("")}</div>`
        : "";

      const kicker = c.layer === "nongaap" ? "Non-GAAP derived metric"
        : c.layer === "rule" ? "SEC Non-GAAP C&DI"
        : c.layer === "fibo" ? "FIBO-aligned concept"
        : c.layer === "discovery" ? (c.gap ? "Discovery coverage gap" : "Discovery source concept")
        : c.layer === "root" ? "Ontology forest root"
        : c.cc || c.de || c.num ? "Built from other concepts"
        : c.f?.atomic ? "Standalone" : "Concept";

      const companyLabels = (c.companyLabels || []).length
        ? `<div class="meta" style="margin-top:8px"><div><b>Company label(s)</b></div>${
            c.companyLabels.map((lab) => `<div>${esc(lab)}</div>`).join("")
          }</div>`
        : "";

      el.innerHTML = `
        <div class="detail">
          <div class="kicker">${kicker}</div>
          <h3>${esc(c.l || c.n)}</h3>
          <div class="cname">${esc(c.n)}</div>
          <div>${badge(c)}</div>
          ${companyLabels}
          ${summarize(c)}
          <div class="meta">
            <div class="meta-box role"><div class="lbl">Role</div><div class="val">${esc(role.label)}</div></div>
            <div class="meta-box type"><div class="lbl">Type / Layer</div><div class="val">${esc(c.t || "—")} · ${esc(c.layer || "gaap")}</div></div>
            <div class="meta-box period"><div class="lbl">Period</div><div class="val">${esc(c.p || "—")}</div></div>
            <div class="meta-box balance"><div class="lbl">Balance</div><div class="val">${esc(c.b || "—")}</div></div>
          </div>
          ${c.d ? `<div class="doc">${esc(c.d)}</div>` : ""}
          ${c.reconciliationHint ? `<div class="summary"><strong>Reconciliation:</strong> ${esc(c.reconciliationHint)}</div>` : ""}
          ${section("Formula", "How this concept is calculated. Click a term to open it.", formulaHtml)}
          ${section("SEC C&DI", "Staff guidance linked to this measure.", renderRules(c))}
          ${section("Presentation children", "Statement line-item hierarchy (curated tree).", preHtml)}
          ${section("Built from", "Concepts this one needs.", built)}
          ${section("Used by", "Concepts that depend on this one.", usedHtml)}
          ${section("Non-GAAP consumers", "Derived metrics that use this GAAP tag.", foHtml)}
          ${section("Maps to GAAP", "Discovery library mappings into taxonomy tags.", mapsHtml)}
          ${section("Discovered by", "Library concepts that reference this tag.", discHtml)}
          ${section("Alignments", "FIBO / cross-layer links.", alignsHtml)}
          ${section("Type grouping", "Broader and narrower types.", groupHtml)}
          ${section("Residual other", "Catch-all residual amounts.", c.ao?.length ? `<div class="hits">${c.ao.map((n) => linkRow(n)).join("")}</div>` : "")}
          ${section("Traits", "Shared characteristics.", c.tr?.length ? `<div class="hits">${c.tr.slice(0, 20).map((n) => linkRow(n)).join("")}</div>` : "")}
        </div>`;

      el.querySelectorAll("[data-go]").forEach((node) => {
        node.addEventListener("click", () => select(node.dataset.go, { openAncestors: true }));
      });
    }

    function nodeBlock(name, depth) {
      const c = concept(name);
      if (!c) return "";
      const kids = childrenOf(name);
      const selected = name === state.selected ? "selected" : "";
      const label = esc(c.l || c.n);
      const nm = esc(c.n);

      if (!kids.length) {
        return `<div class="leaf ${selected}" data-go="${escAttr(name)}">
          <div class="node-main">
            <span class="node-label">${label}</span>
            <span class="node-name">${nm}</span>
          </div>
          ${badge(c)}
        </div>`;
      }

      const open = state.open.has(name) ? "open" : "";
      const shown = kids.slice(0, CHILD_LIMIT);
      let html = `<details ${open} data-node="${escAttr(name)}">
        <summary class="${selected}" data-go="${escAttr(name)}">
          <span class="twist">▸</span>
          <span class="node-main">
            <span class="node-label">${label}</span>
            <span class="node-name">${nm} · ${kids.length} children</span>
          </span>
          ${badge(c)}
        </summary>`;
      if (state.open.has(name)) {
        for (const child of shown) html += nodeBlock(child, depth + 1);
        if (kids.length > CHILD_LIMIT) {
          html += `<div class="empty" style="padding:8px;text-align:left">Showing ${CHILD_LIMIT} of ${kids.length}.</div>`;
        }
      }
      html += `</details>`;
      return html;
    }

    function renderTree() {
      const roots = state.data.ontologyRoots || [];
      const modeHint = {
        presentation: "v1.2 extensible core (collapse + extension hooks)",
        subtypes: "FASB class–subclass types",
        formula: "calculation equations",
        usedby: "concepts that use this one",
        nongaap: "metrics & ratios with formulas",
        discovery: "library maps, FIBO, coverage gaps",
      }[state.mode];
      $("tree-hint").textContent = `${roots.length} roots — ${modeHint}`;
      $("tree").innerHTML = roots.map((r) => nodeBlock(r, 0)).join("") ||
        `<div class="empty">No roots.</div>`;

      $("tree").querySelectorAll("summary[data-go]").forEach((summary) => {
        summary.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const name = summary.dataset.go;
          const details = summary.parentElement;
          const willOpen = !details.open;
          details.open = willOpen;
          if (willOpen) state.open.add(name);
          else state.open.delete(name);
          select(name, { skipTree: true });
          if (willOpen) renderTree();
          else highlight();
        });
      });
      $("tree").querySelectorAll(".leaf[data-go]").forEach((node) => {
        node.addEventListener("click", () => select(node.dataset.go, { skipTree: true }));
      });
      $("tree").querySelectorAll("details").forEach((d) => {
        d.addEventListener("toggle", () => {
          const name = d.dataset.node;
          if (!name) return;
          if (d.open) state.open.add(name);
          else state.open.delete(name);
        });
      });
    }

    function highlight() {
      document.querySelectorAll(".selected").forEach((n) => n.classList.remove("selected"));
      if (!state.selected) return;
      document.querySelectorAll(`[data-go="${CSS.escape(state.selected)}"]`)
        .forEach((n) => n.classList.add("selected"));
    }

    function renderSearch() {
      const box = $("search-hits");
      const q = state.query.trim().toLowerCase();
      if (!q) {
        box.hidden = true;
        box.innerHTML = "";
        return;
      }
      const hits = [];
      for (const c of Object.values(state.data.concepts)) {
        if (c.n.toLowerCase().includes(q) || (c.l || "").toLowerCase().includes(q)) {
          hits.push(c);
          if (hits.length >= 40) break;
        }
      }
      hits.sort((a, b) => (a.l || a.n).localeCompare(b.l || b.n));
      box.hidden = false;
      if (!hits.length) {
        box.innerHTML = `<div class="empty">No matches.</div>`;
        return;
      }
      box.innerHTML = `<div class="hint" style="margin:0 0 6px;color:var(--muted);font-size:0.75rem">${hits.length}${hits.length >= 40 ? "+" : ""} search hits</div>` +
        hits.map((c) => `<div class="hit ${c.n === state.selected ? "selected" : ""}" data-go="${escAttr(c.n)}">
          <div>
            <div class="title">${esc(c.l || c.n)}</div>
            <div class="sub">${esc(c.n)}</div>
          </div>
          ${badge(c)}
        </div>`).join("");
      box.querySelectorAll("[data-go]").forEach((node) => {
        node.addEventListener("click", () => select(node.dataset.go, { openAncestors: true }));
      });
    }

    function select(name, opts = {}) {
      if (!concept(name)) return;
      state.selected = name;
      if (opts.openAncestors) {
        const c = concept(name);
        (c.sp || []).forEach((p) => state.open.add(p));
        (c.pp || []).forEach((p) => state.open.add(p.c));
        // Open forest roots so deep links are reachable
        (state.data.ontologyRoots || []).forEach((r) => state.open.add(r));
      }
      renderDetail(name);
      if (!opts.skipTree) renderTree();
      else highlight();
      renderSearch();
      $("detail").scrollTop = 0;
    }

    function downloadBasename() {
      const meta = state.data?.meta || {};
      if (meta.companySlug) return `${meta.companySlug}-ontology`;
      if (meta.company) {
        return String(meta.company).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-ontology";
      }
      const ver = meta.ontologyVersion || state.sourceId || "ontology";
      return `financial-ontology-${ver}`;
    }

    function triggerDownload(filename, blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function csvEscape(val) {
      const s = val == null ? "" : String(val);
      if (/[",\n\r]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
      return s;
    }

    function linkIds(list) {
      return (list || []).map((x) => (typeof x === "string" ? x : x.c)).filter(Boolean).join("|");
    }

    function formulaWeights(list) {
      return (list || [])
        .map((x) => {
          if (typeof x === "string") return x;
          const w = x.w == null ? "" : `:${x.w}`;
          return `${x.c}${w}`;
        })
        .filter(Boolean)
        .join("|");
    }

    function downloadJson() {
      if (!state.data) return;
      const payload = {
        ...state.data,
        export: {
          format: "json",
          exportedAt: new Date().toISOString(),
          sourceId: state.sourceId,
        },
      };
      const text = JSON.stringify(payload, null, 2);
      triggerDownload(
        `${downloadBasename()}.json`,
        new Blob([text], { type: "application/json;charset=utf-8" })
      );
    }

    function downloadCsv() {
      if (!state.data?.concepts) return;
      const headers = [
        "id",
        "label",
        "definition",
        "layer",
        "kind",
        "period",
        "balance",
        "abstract",
        "expression",
        "tree_children",
        "formula_children",
        "used_by",
        "company_labels",
        "company_populated",
        "company_derived",
        "company_gap",
        "core_tier",
      ];
      const rows = [headers.join(",")];
      const concepts = Object.values(state.data.concepts).sort((a, b) =>
        String(a.n || "").localeCompare(String(b.n || ""))
      );
      for (const c of concepts) {
        rows.push(
          [
            c.n,
            c.l,
            c.d,
            c.layer,
            c.k,
            c.p,
            c.b,
            c.a ? "true" : "false",
            c.expression || "",
            linkIds(c.tc),
            formulaWeights(c.cc),
            linkIds(c.cp),
            (c.companyLabels || []).join("|"),
            c.companyPopulated ? "true" : "false",
            c.companyDerived ? "true" : "false",
            c.companyGap ? "true" : "false",
            c.coreTier || "",
          ].map(csvEscape).join(",")
        );
      }
      // Edge list sheet as extra section would need a second file — emit companion edges CSV too
      const edgeHeaders = ["parent_id", "child_id", "edge_type", "order", "weight", "network"];
      const edgeRows = [edgeHeaders.join(",")];
      for (const c of concepts) {
        for (const x of c.tc || []) {
          edgeRows.push(
            [c.n, x.c, "tree", x.o ?? "", x.w ?? "", x.net ?? ""].map(csvEscape).join(",")
          );
        }
        for (const x of c.cc || []) {
          edgeRows.push(
            [c.n, x.c, "formula", x.o ?? "", x.w ?? "", x.net ?? ""].map(csvEscape).join(",")
          );
        }
      }
      const base = downloadBasename();
      triggerDownload(
        `${base}-concepts.csv`,
        new Blob(["\ufeff" + rows.join("\n")], { type: "text/csv;charset=utf-8" })
      );
      triggerDownload(
        `${base}-edges.csv`,
        new Blob(["\ufeff" + edgeRows.join("\n")], { type: "text/csv;charset=utf-8" })
      );
    }

    function bind() {
      let t = null;
      $("q").addEventListener("input", (e) => {
        state.query = e.target.value;
        clearTimeout(t);
        t = setTimeout(renderSearch, 100);
      });
      $("modes").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-mode]");
        if (!btn) return;
        state.mode = btn.dataset.mode;
        state.open = new Set();
        state.netFilter = null;
        $("modes").querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
        renderTree();
        if (state.selected) renderDetail(state.selected);
      });
      $("tree-source").addEventListener("change", async (e) => {
        const id = e.target.value;
        const entry = state.catalog.find((x) => x.id === id);
        if (!entry) return;
        await loadTree(entry);
      });
      $("dl-json").addEventListener("click", downloadJson);
      $("dl-csv").addEventListener("click", downloadCsv);
    }

    function fillCatalogSelect() {
      const sel = $("tree-source");
      sel.innerHTML = state.catalog.map((x) => {
        let extra = "";
        if (x.populated != null) {
          extra = ` (${x.populated} populated`;
          if (x.gaps) extra += `, ${x.gaps} gaps`;
          extra += ")";
        }
        return `<option value="${escAttr(x.id)}">${esc(x.label)}${esc(extra)}</option>`;
      }).join("");
      sel.value = state.sourceId;
    }

    async function loadTree(entry) {
      const res = await fetch(entry.path);
      if (!res.ok) throw new Error(`HTTP ${res.status} loading ${entry.path}`);
      state.data = await res.json();
      state.sourceId = entry.id;
      state.open = new Set();
      state.query = "";
      state.netFilter = null;
      if ($("q")) $("q").value = "";
      state.mode = state.data.meta?.defaultBrowseMode || "presentation";
      $("modes").querySelectorAll("button").forEach((b) =>
        b.classList.toggle("active", b.dataset.mode === state.mode)
      );
      const roots = state.data.ontologyRoots || [];
      state.selected = roots[0] || null;
      document.querySelector("header h1").innerHTML = state.data.meta?.company
        ? `${esc(state.data.meta.company)} <span>tree</span>`
        : `Financial Ontology <span>2026</span>`;
      $("tree-hint").textContent = state.data.meta?.company
        ? `Company tree — only populateable leaves/branches from ${state.data.meta.company}`
        : "Unified forest — click ▸ to expand";
      fillCatalogSelect();
      renderStats();
      renderTree();
      if (state.selected) renderDetail(state.selected);
      else $("detail").innerHTML = `<div class="empty">Select a concept.</div>`;
    }

    async function boot() {
      try {
        let catalog = [];
        try {
          const catRes = await fetch("companies/catalog.json");
          if (catRes.ok) catalog = await catRes.json();
        } catch (_) { /* optional */ }
        if (!catalog.length) {
          catalog = [{ id: "v1.2", label: "Ontology v1.2 (full core)", path: "taxonomy-data.json" }];
        }
        state.catalog = catalog;
        const initial = catalog.find((x) => x.id === "v1.2") || catalog[0];
        state.sourceId = initial.id;
        fillCatalogSelect();
        bind();
        await loadTree(initial);
      } catch (err) {
        $("app").innerHTML = `<div class="error">
          <h2>Could not load data</h2>
          <p>Serve this folder over HTTP (cannot open as a file:// page).</p>
          <p><code>python -m http.server 8877 --bind 127.0.0.1</code></p>
          <p>${esc(String(err))}</p>
        </div>`;
      }
    }

    boot();
  </script>
